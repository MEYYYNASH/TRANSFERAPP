name: Build & Release PIXELDROP

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build APK and Publish Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Build Genuine PIXELDROP Android APK
        working-directory: apps/android
        run: |
          mkdir -p /tmp/backup_app
          cp -r lib /tmp/backup_app/
          cp pubspec.yaml /tmp/backup_app/
          cp debug.keystore /tmp/backup_app/

          rm -rf android
          flutter create --platforms=android --org com.pixeldrop --project-name pixeldrop .

          rm -rf lib
          cp -r /tmp/backup_app/lib .
          cp /tmp/backup_app/pubspec.yaml .

          # Setup fixed permanent debug keystore inside both android/app and ~/.android
          cp /tmp/backup_app/debug.keystore android/app/debug.keystore
          mkdir -p ~/.android
          cp /tmp/backup_app/debug.keystore ~/.android/debug.keystore

          # Explicitly inject signingConfigs before buildTypes in build.gradle
          sed -i '/buildTypes {/i \    signingConfigs {\n        debug {\n            storeFile file("debug.keystore")\n            storePassword "android"\n            keyAlias "androiddebugkey"\n            keyPassword "android"\n        }\n    }' android/app/build.gradle

          sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.CAMERA"/>\n    <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES"/>' android/app/src/main/AndroidManifest.xml

          flutter pub get
          flutter build apk --debug

          echo "Verifying compiled APK signature:"
          keytool -printcert -jarfile build/app/outputs/flutter-apk/app-debug.apk

      - name: Assemble Release Assets
        run: |
          mkdir -p release-files
          cp apps/android/build/app/outputs/flutter-apk/app-debug.apk release-files/PIXELDROP.apk

          TAG="${GITHUB_REF_NAME:-v1.0.7}"
          VERSION="${TAG#v}"
          PUB_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          APK_SHA=$(sha256sum release-files/PIXELDROP.apk | awk '{print $1}')
          APK_SIZE=$(stat -c%s release-files/PIXELDROP.apk)

          cat <<EOF > release-files/latest.json
          {
            "version": "$VERSION",
            "release_date": "$PUB_DATE",
            "release_notes": "🚀 PIXELDROP $VERSION: Genuine PIXELDROP UI, Working File Picker, Live Camera QR Scanner, and In-App Auto Updates.",
            "mandatory": false,
            "apk_url": "https://github.com/${{ github.repository }}/releases/download/$TAG/PIXELDROP.apk"
          }
          EOF

          echo "Ready to release:"
          ls -lh release-files

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-files/*
          tag_name: ${{ github.ref_name }}
          name: PIXELDROP ${{ github.ref_name }}
          body: |
            ## ⚡ PIXELDROP ${{ github.ref_name }} (Latest)
            
            Premium Dark Pixel Cross-Platform File Transfer for **Android** and **Windows**.
            
            ### 📦 Direct Downloads:
            - 📱 **Android APK**: [`PIXELDROP.apk`](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/PIXELDROP.apk) (Genuine PIXELDROP App)
            - 📄 **In-App Update Manifest**: [`latest.json`](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/latest.json)
            
            ### ✨ Features in this release:
            - **Complete PIXELDROP UI**: Dark Pixel Theme (`#080808` & `#FF6338`).
            - **Working Native File Picker**: Tap 'SEND FILES' to pick photos, videos, files, and APKs.
            - **Live Camera QR Scanner**: Tap 'SCAN QR' to scan the PC's QR code with your phone camera.
            - **In-App Auto Update**: Installed apps detect this release and update directly inside the app without opening a browser.
          draft: false
          prerelease: false
