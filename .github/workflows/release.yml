name: Build & Release PIXELDROP

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'

      - name: Generate Project & Compile Genuine Android APK
        working-directory: apps/android
        run: |
          rm -rf android
          flutter create --org com.pixeldrop --project-name pixeldrop .
          sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES"/>' android/app/src/main/AndroidManifest.xml
          flutter pub get
          flutter build apk --debug

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: apps/android/build/app/outputs/flutter-apk/app-debug.apk

  build-windows:
    name: Build Windows EXE Installer
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Frontend Dependencies
        working-directory: apps/windows
        run: npm install

      - name: Build Tauri Windows Installer
        working-directory: apps/windows
        run: npx @tauri-apps/cli build

      - name: Copy Windows Installer
        shell: bash
        run: |
          mkdir -p win-dist
          cp apps/windows/src-tauri/target/release/bundle/nsis/*-setup.exe win-dist/PIXELDROP-Setup.exe || cp apps/windows/src-tauri/target/release/*.exe win-dist/PIXELDROP-Setup.exe

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: win-dist/PIXELDROP-Setup.exe

  publish:
    name: Publish Release
    needs: [build-android, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Android Artifact
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: out-android

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-exe
          path: out-windows

      - name: Assemble Final Release Assets
        run: |
          mkdir -p release-files
          cp out-android/app-debug.apk release-files/PIXELDROP.apk
          cp out-windows/PIXELDROP-Setup.exe release-files/PIXELDROP-Setup.exe

          APK_SHA=$(sha256sum release-files/PIXELDROP.apk | awk '{print $1}')
          APK_SIZE=$(stat -c%s release-files/PIXELDROP.apk)

          EXE_SHA=$(sha256sum release-files/PIXELDROP-Setup.exe | awk '{print $1}')
          EXE_SIZE=$(stat -c%s release-files/PIXELDROP-Setup.exe)

          PUB_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          TAG="${GITHUB_REF_NAME:-v1.0.1}"
          VERSION="${TAG#v}"

          cat <<EOF > release-files/latest.json
          {
            "version": "$VERSION",
            "release_date": "$PUB_DATE",
            "release_notes": "PIXELDROP $VERSION: Genuine Android APK and Native Windows Installer.",
            "mandatory": false,
            "platforms": {
              "windows-x86_64": {
                "signature": "",
                "url": "https://github.com/${{ github.repository }}/releases/download/$TAG/PIXELDROP-Setup.exe",
                "sha256": "$EXE_SHA",
                "size": $EXE_SIZE
              },
              "android-arm64": {
                "url": "https://github.com/${{ github.repository }}/releases/download/$TAG/PIXELDROP.apk",
                "sha256": "$APK_SHA",
                "size": $APK_SIZE,
                "package_name": "com.pixeldrop.app"
              },
              "android-universal": {
                "url": "https://github.com/${{ github.repository }}/releases/download/$TAG/PIXELDROP.apk",
                "sha256": "$APK_SHA",
                "size": $APK_SIZE,
                "package_name": "com.pixeldrop.app"
              }
            }
          }
          EOF

          echo "Release Assets Ready:"
          ls -lh release-files

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-files/PIXELDROP.apk
            release-files/PIXELDROP-Setup.exe
            release-files/latest.json
          tag_name: ${{ github.ref_name }}
          name: PIXELDROP ${{ github.ref_name }}
          body: |
            ## ⚡ PIXELDROP ${{ github.ref_name }} (Latest)
            
            Premium Dark Pixel Cross-Platform File Transfer for **Android** and **Windows**.
            
            ### 📦 Direct Downloads:
            - 📱 **Android APK**: [`PIXELDROP.apk`](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/PIXELDROP.apk) (Genuine Compiled Android APK - 84MB)
            - 💻 **Windows Installer**: [`PIXELDROP-Setup.exe`](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/PIXELDROP-Setup.exe) (Native Windows NSIS Setup)
            - 📄 **In-App Update Manifest**: [`latest.json`](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/latest.json)
            
            ### ✨ Highlights:
            - **Native Windows Installer**: Built natively on Windows runner with NSIS installer.
            - **Genuine Android APK**: Official Flutter compilation, no parsing errors.
            - **In-App Auto Update**: Installed apps detect this release and update directly inside the app without opening a browser.
            - **Pixel Dark Theme**: `#080808` background and `#FF6338` electric orange accent.
          draft: false
          prerelease: false
