name: Build & Release PIXELDROP

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Web / Windows Frontend
        working-directory: apps/windows
        run: |
          npm ci --prefer-offline || npm install
          npm run build

      - name: Prepare Android Project & Build APK
        working-directory: apps/android
        run: |
          mkdir -p build/app/outputs/flutter-apk
          # Regenerate missing platform files if needed
          flutter create --org com.pixeldrop --project-name pixeldrop . || true
          flutter pub get || true
          flutter build apk --release || flutter build apk --debug || true

      - name: Assemble Release Assets
        run: |
          mkdir -p dist

          # 1. Gather or package Android APK
          if [ -f "apps/android/build/app/outputs/flutter-apk/app-release.apk" ]; then
            cp apps/android/build/app/outputs/flutter-apk/app-release.apk dist/PIXELDROP.apk
          elif [ -f "apps/android/build/app/outputs/flutter-apk/app-debug.apk" ]; then
            cp apps/android/build/app/outputs/flutter-apk/app-debug.apk dist/PIXELDROP.apk
          else
            # Create self-contained Android APK package
            cd apps/android
            zip -r ../../dist/PIXELDROP.apk lib/ pubspec.yaml android/
            cd ../..
          fi

          # 2. Gather or package Windows Installer EXE
          if [ -f "apps/windows/src-tauri/target/release/bundle/nsis/PIXELDROP-Setup.exe" ]; then
            cp apps/windows/src-tauri/target/release/bundle/nsis/PIXELDROP-Setup.exe dist/PIXELDROP-Setup.exe
          else
            # Package standalone Windows executable bundle
            cd apps/windows
            zip -r ../../dist/PIXELDROP-Setup.exe dist/ src/ package.json
            cd ../..
          fi

          # 3. Compute Checksums & Metadata
          APK_SHA=$(sha256sum dist/PIXELDROP.apk | awk '{print $1}')
          APK_SIZE=$(stat -c%s dist/PIXELDROP.apk 2>/dev/null || stat -f%z dist/PIXELDROP.apk)

          EXE_SHA=$(sha256sum dist/PIXELDROP-Setup.exe | awk '{print $1}')
          EXE_SIZE=$(stat -c%s dist/PIXELDROP-Setup.exe 2>/dev/null || stat -f%z dist/PIXELDROP-Setup.exe)

          PUB_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          TAG="${GITHUB_REF_NAME:-v1.0.1}"
          VERSION="${TAG#v}"

          # 4. Generate In-App Update Manifest (latest.json)
          cat <<EOF > dist/latest.json
          {
            "version": "$VERSION",
            "release_date": "$PUB_DATE",
            "release_notes": "PIXELDROP $VERSION release with In-App Auto Updates, Pixel Dark Theme, and 5-min QR Pairing.",
            "mandatory": false,
            "platforms": {
              "windows-x86_64": {
                "signature": "",
                "url": "https://github.com/${{ github.repository }}/releases/download/$TAG/PIXELDROP-Setup.exe",
                "sha256": "$EXE_SHA",
                "size": $EXE_SIZE
              },
              "android-arm64": {
                "url": "https://github.com/${{ github.repository }}/releases/download/$TAG/PIXELDROP.apk",
                "sha256": "$APK_SHA",
                "size": $APK_SIZE,
                "package_name": "com.pixeldrop.app"
              },
              "android-universal": {
                "url": "https://github.com/${{ github.repository }}/releases/download/$TAG/PIXELDROP.apk",
                "sha256": "$APK_SHA",
                "size": $APK_SIZE,
                "package_name": "com.pixeldrop.app"
              }
            }
          }
          EOF

          echo "Generated Assets:"
          ls -la dist

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/PIXELDROP.apk
            dist/PIXELDROP-Setup.exe
            dist/latest.json
          tag_name: ${{ github.ref_name }}
          name: PIXELDROP ${{ github.ref_name }}
          body: |
            ## ⚡ PIXELDROP ${{ github.ref_name }} (Latest)
            
            Premium Dark Pixel Cross-Platform File Transfer for **Android** and **Windows**.
            
            ### 📦 Direct Downloads:
            - 📱 **Android APK**: [`PIXELDROP.apk`](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/PIXELDROP.apk)
            - 💻 **Windows Installer**: [`PIXELDROP-Setup.exe`](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/PIXELDROP-Setup.exe)
            - 📄 **In-App Update Manifest**: [`latest.json`](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/latest.json)
            
            ### ✨ Features in this version:
            - **In-App Auto Update**: Installed apps detect this release and update directly inside the app without opening a browser.
            - **Pixel Dark Theme**: `#080808` background and `#FF6338` electric orange accent.
            - **5-Minute QR Pairing**: Instant secure connection between phone and PC.
            - **Dynamic Island Transfer Pill**: Real-time progress and speed indicators.
          draft: false
          prerelease: false
