name: pixeldrop
description: PIXELDROP - Dark Pixel Cross-Platform File Transfer
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.7.0
  path_provider: ^2.1.4
  permission_handler: ^11.3.1
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.2.3
  flutter_local_notifications: ^17.2.3
  package_info_plus: ^8.1.0
  open_filex: ^4.5.0
  crypto: ^3.0.5
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
